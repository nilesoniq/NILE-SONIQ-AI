<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">

<title>NileSoniQ AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --orange: #ff6a00;
    --orange2: #ff8c38;
    --black: #080808;
    --sidebar: #0d0d0d;
    --panel: #111111;
    --panel2: #171717;
    --border: #242424;
    --text: #f5f5f5;
    --muted: #8c8c8c;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: var(--black);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 270px;
    height: 100vh;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px;
    flex-shrink: 0;
}

/* BRAND */

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 8px 6px 18px;
}

.logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        var(--orange),
        #ff3d00
    );

    color: #000;
    font-size: 19px;
    font-weight: 950;

    box-shadow:
        0 0 20px rgba(255,106,0,.18);
}

.brand-name {
    font-size: 17px;
    font-weight: 850;
}

.brand-name span {
    color: var(--orange);
}

/* NEW CHAT */

.new-chat {
    width: 100%;
    border: 1px solid #303030;
    background: #151515;
    color: white;

    padding: 12px 14px;
    border-radius: 11px;

    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.new-chat:hover {
    background: #1d1d1d;
    border-color: rgba(255,106,0,.5);
}

.plus {
    color: var(--orange);
    font-size: 20px;
    line-height: 10px;
}

/* SIDEBAR TITLE */

.sidebar-title {
    color: #666;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;

    margin: 25px 7px 9px;
}

/* CHAT HISTORY */

.history {
    flex: 1;
    overflow-y: auto;
}

.history::-webkit-scrollbar {
    width: 4px;
}

.history::-webkit-scrollbar-thumb {
    background: #2b2b2b;
}

.chat-item {
    padding: 11px 10px;
    border-radius: 9px;
    color: #bbb;
    font-size: 13px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    cursor: pointer;
    margin-bottom: 3px;

    transition: .15s;
}

.chat-item:hover {
    background: #171717;
    color: white;
}

.chat-item.active {
    background: #1a1a1a;
    color: white;
    border-left: 2px solid var(--orange);
}

/* SIDEBAR BOTTOM */

.sidebar-bottom {
    border-top: 1px solid var(--border);
    padding-top: 12px;
}

.account {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
}

.avatar {
    width: 31px;
    height: 31px;
    border-radius: 50%;

    background: var(--orange);
    color: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: 900;
    font-size: 12px;
}

.account-text strong {
    display: block;
    font-size: 12px;
}

.account-text small {
    color: #666;
    font-size: 10px;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    height: 100vh;
    min-width: 0;

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(255,106,0,.08),
            transparent 35%
        ),
        #080808;
}

/* =========================
   TOP HEADER
========================= */

.header {
    height: 62px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    border-bottom: 1px solid var(--border);

    background: rgba(8,8,8,.88);

    backdrop-filter: blur(15px);

    flex-shrink: 0;
}

.mobile-menu {
    display: none;

    border: 0;
    background: transparent;
    color: white;

    font-size: 22px;
    cursor: pointer;
}

.header-title {
    font-size: 14px;
    font-weight: 800;
}

.header-title span {
    color: var(--orange);
}

.online {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #777;
    font-size: 10px;
    font-weight: 700;
}

.online-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;

    background: #2bd27c;

    box-shadow:
        0 0 10px rgba(43,210,124,.7);
}

/* =========================
   CHAT AREA
========================= */

.chat {
    flex: 1;
    overflow-y: auto;

    padding: 35px 20px 150px;
}

.chat::-webkit-scrollbar {
    width: 5px;
}

.chat::-webkit-scrollbar-thumb {
    background: #272727;
    border-radius: 10px;
}

.messages {
    width: min(850px, 100%);
    margin: auto;
}

/* WELCOME */

.welcome {
    text-align: center;
    padding-top: 12vh;
    padding-bottom: 45px;
}

.welcome-logo {
    width: 62px;
    height: 62px;

    margin: 0 auto 20px;

    border-radius: 19px;

    background:
        linear-gradient(
            135deg,
            var(--orange),
            #ff3d00
        );

    color: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 29px;
    font-weight: 950;

    box-shadow:
        0 0 45px rgba(255,106,0,.18);
}

.welcome h1 {
    font-size: clamp(27px, 5vw, 42px);
    letter-spacing: -1.5px;
    margin-bottom: 12px;
}

.welcome h1 span {
    color: var(--orange);
}

.welcome p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;

    max-width: 560px;
    margin: auto;
}

/* =========================
   MESSAGES
========================= */

.message {
    display: flex;
    gap: 13px;

    margin-bottom: 28px;

    animation: appear .2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message-avatar {
    width: 32px;
    height: 32px;

    flex-shrink: 0;

    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    font-weight: 900;
}

.message.user .message-avatar {
    background: #292929;
    color: white;
}

.message.ai .message-avatar {
    background: var(--orange);
    color: #000;
}

.message-content {
    flex: 1;

    min-width: 0;

    font-size: 14px;
    line-height: 1.65;
}

.message-name {
    font-size: 11px;
    font-weight: 800;

    margin-bottom: 5px;

    color: #777;
}

.message.ai .message-name {
    color: var(--orange);
}

.message-text {
    color: #e5e5e5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

/* CODE */

.code {
    margin-top: 12px;

    background: #050505;

    border: 1px solid #292929;

    border-radius: 10px;

    padding: 15px;

    overflow-x: auto;

    color: #ddd;

    font-family:
        Consolas,
        Monaco,
        monospace;

    font-size: 12px;
}

/* TYPING */

.typing {
    display: flex;
    align-items: center;
    gap: 5px;

    padding: 8px 0;
}

.typing i {
    display: block;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--orange);

    animation: typing 1s infinite;
}

.typing i:nth-child(2) {
    animation-delay: .15s;
}

.typing i:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {

    0%,
    60%,
    100% {
        opacity: .25;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-4px);
    }
}

/* =========================
   INPUT AREA
========================= */

.input-area {
    position: fixed;

    bottom: 0;

    left: 270px;
    right: 0;

    padding: 18px 20px 20px;

    background:
        linear-gradient(
            transparent,
            #080808 25%
        );

    z-index: 10;
}

.input-wrap {
    width: min(850px, 100%);
    margin: auto;
}

.input-box {
    display: flex;
    align-items: flex-end;
    gap: 8px;

    padding: 8px;

    background: #151515;

    border: 1px solid #303030;

    border-radius: 16px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.4);

    transition: .2s;
}

.input-box:focus-within {
    border-color: rgba(255,106,0,.55);

    box-shadow:
        0 0 0 1px rgba(255,106,0,.08),
        0 10px 40px rgba(0,0,0,.5);
}

#input {
    flex: 1;

    resize: none;

    min-height: 44px;
    max-height: 150px;

    padding: 12px;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    font-family: inherit;
    font-size: 14px;
}

#input::placeholder {
    color: #666;
}

.send {
    width: 43px;
    height: 43px;

    border: 0;

    border-radius: 12px;

    background: var(--orange);

    color: #000;

    font-size: 18px;
    font-weight: 900;

    cursor: pointer;

    transition: .2s;
}

.send:hover {
    transform: scale(1.04);

    box-shadow:
        0 0 22px rgba(255,106,0,.25);
}

.send:active {
    transform: scale(.95);
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.disclaimer {
    text-align: center;

    color: #4f4f4f;

    font-size: 9px;

    margin-top: 8px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {
        position: fixed;
        left: -280px;
        top: 0;

        z-index: 100;

        transition: left .25s ease;

        box-shadow:
            10px 0 40px rgba(0,0,0,.5);
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block;
    }

    .header {
        padding: 0 15px;
    }

    .header-title {
        margin-left: 10px;
        flex: 1;
    }

    .chat {
        padding-left: 14px;
        padding-right: 14px;
    }

    .welcome {
        padding-top: 8vh;
    }

    .welcome h1 {
        font-size: 30px;
    }

    .message-content {
        font-size: 13px;
    }

    .input-area {
        left: 0;
        padding: 12px 10px 14px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="logo">
                N
            </div>

            <div class="brand-name">
                NileSoniQ <span>AI</span>
            </div>

        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            <span class="plus">+</span>
            New chat
        </button>

        <div class="sidebar-title">
            Conversations
        </div>

        <div class="history" id="history">

            <div
                class="chat-item active"
                onclick="loadChat(this)"
            >
                New conversation
            </div>

        </div>

        <div class="sidebar-bottom">

            <div class="account">

                <div class="avatar">
                    N
                </div>

                <div class="account-text">

                    <strong>NileSoniQ AI</strong>

                    <small>
                        AI Assistant
                    </small>

                </div>

            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="header">

            <button
                class="mobile-menu"
                onclick="toggleSidebar()"
            >
                ☰
            </button>

            <div class="header-title">
                <span>NileSoniQ</span> AI
            </div>

            <div class="online">

                <span class="online-dot"></span>

                ONLINE

            </div>

        </header>


        <!-- CHAT -->

        <section class="chat" id="chat">

            <div class="messages" id="messages">

                <div class="welcome" id="welcome">

                    <div class="welcome-logo">
                        N
                    </div>

                    <h1>
                        How can <span>NileSoniQ AI</span><br>
                        help you today?
                    </h1>

                    <p>
                        Ask questions, write code, solve problems,
                        explain ideas, create content, or explore
                        something new.
                    </p>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-wrap">

                <div class="input-box">

                    <textarea
                        id="input"
                        rows="1"
                        placeholder="Message NileSoniQ AI..."
                        onkeydown="handleKey(event)"
                    ></textarea>

                    <button
                        class="send"
                        id="sendButton"
                        onclick="send()"
                    >
                        ↑
                    </button>

                </div>

                <div class="disclaimer">
                    NileSoniQ AI can make mistakes. Check important information.
                </div>

            </div>

        </div>

    </main>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const input =
    document.getElementById("input");

const messages =
    document.getElementById("messages");

const chat =
    document.getElementById("chat");

const history =
    document.getElementById("history");

const sidebar =
    document.getElementById("sidebar");

const sendButton =
    document.getElementById("sendButton");


/* =========================
   CONVERSATION MEMORY
========================= */

/*
   This stores the current conversation
   in the browser while the page is open.

   The API key is NOT stored here.
*/

let conversationHistory = [];

let isSending = false;


/* =========================
   MOBILE SIDEBAR
========================= */

function toggleSidebar() {

    sidebar.classList.toggle("open");

}


/* =========================
   ESCAPE TEXT
========================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, type) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const avatar =
        type === "ai" ? "N" : "You";

    const name =
        type === "ai"
            ? "NileSoniQ AI"
            : "You";

    message.innerHTML = `

        <div class="message-avatar">
            ${avatar}
        </div>

        <div class="message-content">

            <div class="message-name">
                ${name}
            </div>

            <div class="message-text">
                ${escapeHTML(text)}
            </div>

        </div>

    `;

    messages.appendChild(message);

    scrollBottom();

}


/* =========================
   TYPING
========================= */

function showTyping() {

    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.id =
        "typingMessage";

    message.innerHTML = `

        <div class="message-avatar">
            N
        </div>

        <div class="message-content">

            <div class="message-name">
                NileSoniQ AI
            </div>

            <div class="typing">
                <i></i>
                <i></i>
                <i></i>
            </div>

        </div>

    `;

    messages.appendChild(message);

    scrollBottom();

}


function removeTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if (typing) {
        typing.remove();
    }

}


/* =========================
   SEND MESSAGE
========================= */

async function send() {

    const text =
        input.value.trim();

    if (!text || isSending) {
        return;
    }

    isSending = true;

    sendButton.disabled = true;

    addMessage(text, "user");

    input.value = "";

    resizeInput();

    showTyping();


    try {

        /*
           Send the user's message and the
           previous conversation to our Vercel
           backend.

           The private OpenRouter API key
           NEVER appears in this HTML.
        */

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    message: text,

                    history:
                        conversationHistory.slice(-12)

                })

            });


        let data;

        try {

            data =
                await response.json();

        } catch (jsonError) {

            data = {
                error:
                    "The server returned an invalid response."
            };

        }


        removeTyping();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "The AI request failed."
            );

        }


        const reply =
            data.reply;


        if (
            !reply ||
            typeof reply !== "string"
        ) {

            throw new Error(
                "The AI returned an empty response."
            );

        }


        /*
           Save both sides of the conversation
           so follow-up questions have context.
        */

        conversationHistory.push({

            role: "user",

            content: text

        });


        conversationHistory.push({

            role: "assistant",

            content: reply

        });


        /*
           Keep the browser history from becoming
           unnecessarily large.
        */

        if (
            conversationHistory.length > 20
        ) {

            conversationHistory =
                conversationHistory.slice(-20);

        }


        addMessage(
            reply,
            "ai"
        );


    } catch (error) {

        removeTyping();

        console.error(
            "NileSoniQ AI error:",
            error
        );


        let errorMessage =
            "Sorry, I couldn't connect to NileSoniQ AI right now. Please try again.";


        if (
            error &&
            error.message
        ) {

            errorMessage =
                "Sorry, NileSoniQ AI couldn't complete that request.\n\n" +
                error.message;

        }


        addMessage(
            errorMessage,
            "ai"
        );

    } finally {

        isSending = false;

        sendButton.disabled = false;

        input.focus();

    }

}


/* =========================
   ENTER TO SEND
========================= */

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        send();

    }

}


/* =========================
   AUTO RESIZE
========================= */

input.addEventListener(
    "input",
    resizeInput
);


function resizeInput() {

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";

}


/* =========================
   SCROLL
========================= */

function scrollBottom() {

    setTimeout(() => {

        chat.scrollTo({

            top:
                chat.scrollHeight,

            behavior:
                "smooth"

        });

    }, 30);

}


/* =========================
   NEW CHAT
========================= */

function newChat() {

    /*
       Clear the conversation memory.
    */

    conversationHistory = [];


    /*
       Reset the visual chat.
    */

    messages.innerHTML = `

        <div class="welcome" id="welcome">

            <div class="welcome-logo">
                N
            </div>

            <h1>
                How can <span>NileSoniQ AI</span><br>
                help you today?
            </h1>

            <p>
                Ask questions, write code, solve problems,
                explain ideas, create content, or explore
                something new.
            </p>

        </div>

    `;


    input.value = "";

    resizeInput();


    addHistoryItem();


    if (
        window.innerWidth <= 700
    ) {

        sidebar.classList.remove(
            "open"
        );

    }


    input.focus();

}


/* =========================
   CHAT HISTORY
========================= */

function addHistoryItem() {

    const item =
        document.createElement("div");

    item.className =
        "chat-item active";

    item.textContent =
        "New conversation";


    history
        .querySelectorAll(".chat-item")
        .forEach(el => {

            el.classList.remove(
                "active"
            );

        });


    history.prepend(item);

}


/* =========================
   LOAD CHAT
========================= */

function loadChat(item) {

    history
        .querySelectorAll(".chat-item")
        .forEach(el => {

            el.classList.remove(
                "active"
            );

        });


    item.classList.add(
        "active"
    );


    if (
        window.innerWidth <= 700
    ) {

        sidebar.classList.remove(
            "open"
        );

    }

}


/* =========================
   STARTUP
========================= */

input.focus();

</script>

</body>
    </html>
